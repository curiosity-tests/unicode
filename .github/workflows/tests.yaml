run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on: 
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test. Defaults to the usual checkout for this event.'
        type: string
        required: false
        default: ''

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  ZIG_VERSION: "0.16.0"

jobs:
  fuzz-smoke:
    name: Coverage-guided fuzz smoke (Linux x64)
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          ref: ${{ inputs.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Run bounded fuzz smoke
        run: ROC=roc python3 scripts/fuzz.py smoke

  test:
    name: ./scripts/all_tests.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          ref: ${{ inputs.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - run: roc version

      - name: Run all tests
        run: ROC=roc ./scripts/all_tests.sh

      - name: Upload minimized Bidi regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bidi-regressions-${{ matrix.os }}
          path: .roc-unicode-tmp/failures
          if-no-files-found: ignore
